<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <title>{{.SiteTitle}}</title>
</head>
<body>
    <nav class="navbar">
        <img src="{{if .AvatarURL}}{{.AvatarURL}}{{else}}favicon.png{{end}}" alt="{{.SiteTitle}}" class="navbar-icon">
        <ul>
            {{range .NavLinks}}<li><a href="{{.URL}}">{{.Label}}</a></li>{{end}}
        </ul>
    </nav>

    <div class="site-header">
        <h1 class="site-title">
            {{.SiteTitle}}
            {{if .SiteTitleSuffix}}<span class="site-title-separator"></span><span class="site-title-suffix">{{.SiteTitleSuffix}}</span>{{end}}
        </h1>
        {{if .SiteDescription}}<span class="site-description">{{.SiteDescription}}</span>{{end}}
    </div>

    <hr class="header-rule">

    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
